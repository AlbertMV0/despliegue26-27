name: CI Validar y Testear

on:
  #Se va a ejecutar manualmente
  workflow_dispatch:

jobs:
  lint-and-validate:
    # Se va a ejecutar en una marquina virtual de ubuntu
    runs-on: ubuntu-latest
    steps:
      # Instala el repositorio en la maáquina virtual para poder acceder a él
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependencias
        #working-directory: ./Despliegue
        run: npm ci

      - name: Validar HTML (html-validate)
        #working-directory: ./Despliegue
        run: npx html-validate index.html

      - name: Linting CSS (stylelint)
        run: npx stylelint "css/**/*.css"

      - name: Linting JavaScript (eslint)
        run: npx eslint js/