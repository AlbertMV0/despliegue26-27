name: CI Validar y Testear

on:
  #Se va a ejecutar manualmente
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        #working-directory: ./Despliegue Solo es necesario si el index.html no está en la raiz del repositorio
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependencias
        #working-directory: ./Despliegue
        run: npm ci

      - name: Validar HTML (html-validate)
        #working-directory: ./Despliegue
        run: npx html-validate index.html